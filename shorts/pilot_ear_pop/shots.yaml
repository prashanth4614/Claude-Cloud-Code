# Pilot storyboard: "Why your ears pop on a plane". Timed to the approved voice take
# (audio/voice_take.json). The Blender scene builder reads this file; any camera can
# still be refined by hand in Blender.
#
# Vocabulary (shorts/blender/rigs.py implements each one):
#   size:   EWS extreme wide | WS wide | MS medium | MCU medium close-up | CU close-up | ECU extreme close-up | MACRO
#   angle:  eye | low | high | aerial | dutch:<deg> | ots (over the shoulder) | pov
#   move:   static | dolly_in | dolly_out | truck | pedestal | crane_up | crane_down | orbit:<deg> | arc:<deg>
#           drone_track (follow beside a subject) | drone_reveal (pull back + rise) | drone_flyover
#           flythrough (camera path through geometry) | push_through (into a hole, ends black)
#           handheld:<0-1> (subtle noise) | rack_focus:<from>-><to> | dolly_zoom (vertigo)
#   in/out: transitions. Edit-level: cut | dissolve:<frames> | dip_black:<frames> | flash:<frames>.
#           In-camera: match_cut:<shape> | whip:<left|right> | push_through | occlusion:<object> | focus_pull
#   beats:  actions keyed to a spoken word (snap to that word's timestamp) or a time in seconds
#           (`key:` names a timed beat so the build can find it).
#   from_word (+ offset s): the shot starts at that word of its line (default: 0.1 s before it).
#   tail:   seconds of picture after the last line (the relief + follow card end).
#   handles: 10 frames are rendered either side of every shot so transitions can overlap.

video: pilot_ear_pop
fps: 30
resolution: [1080, 1920]
engine: CYCLES            # final render; the animatic uses EEVEE
grade: warm_filmic        # one LUT for the whole film; per-shot "mood" tweaks only
tail: 1.6
motifs:
  outside_air: "cool blue glowing molecules"
  inside_air: "warm amber glowing molecules"
  screen_direction: "plane climbs left-to-right and lands right-to-left (keeps geography clear)"
  host: "Max: the emotional anchor; we cut to his face when the viewer should *feel* it"
  journey: "one continuous voyage: into Max's ear, down the canal, through the eardrum, down the tube, and back out"

shots:
  - id: S00
    line: 1                     # cold open: "Ever wondered..." over Max wincing (Zack opens on the consequence)
    set: cabin
    size: CU
    angle: eye
    lens_mm: 85
    move: handheld:0.3
    beats:
      - {at: 0.0, key: wince, do: "Max already wincing, hand pressed to his ear"}
    mood: discomfort
    out: cut

  - id: S01
    line: 1                     # "...why your ears pop on a plane?"
    from_word: why
    set: sky_golden_hour
    size: WS
    angle: low
    lens_mm: 24
    move: drone_reveal          # under the wing, pulling back and rising as the jet climbs past
    beats:
      - {word: pop, do: "sun flare sweeps across the lens"}
    fx: [volumetric_clouds, god_rays, lens_flare_soft, motion_blur]
    mood: golden, wonder
    out: match_cut:window

  - id: S02
    line: 1                     # "...plane?" (+ the breath before line 2)
    from_word: plane
    set: cabin
    size: MS
    angle: eye
    lens_mm: 50
    move: push_through          # fast curved push round Max into his ear opening; ends in darkness
    beats:
      - {word: plane, key: touch, do: "Max touches his ear as the camera swings round"}
    fx: [shallow_dof, window_light_shafts]
    mood: curious
    out: push_through

  - id: S03
    line: 2                     # "...eardrum sits a tiny pocket of air - your middle ear."
    from_word: eardrum
    set: ear_inside
    size: MACRO
    angle: pov
    lens_mm: 20
    move: flythrough            # one continuous glide down the glowing canal to the eardrum
    beats:
      - {word: eardrum, do: "the pearly eardrum ahead catches the light"}
      - {word: middle, do: "camera slows, face to face with the eardrum"}
    fx: [volumetric_haze, floating_particles, subsurface_tissue]
    mood: discovery
    out: cut

  - id: S04
    line: 3                     # "On the ground, the pressure inside..."
    set: ear_inside
    size: MACRO
    angle: pov
    lens_mm: 22
    move: flythrough            # slips through the eardrum into the middle ear and turns back to look at it
    beats:
      - {word: ground, do: "into the middle ear"}
    fx: [molecules, subsurface_tissue]
    mood: wonder
    out: cut

  - id: S04m
    line: 3                     # "...matches the air outside."
    from_word: matches
    set: ear_map
    size: MS
    angle: eye
    lens_mm: 50
    move: dolly_in              # orientation beat: labelled x-ray map, slow push in; OUTSIDE = INSIDE badge
    beats:
      - {word: matches, do: "labels CANAL / EARDRUM / MIDDLE EAR / TUBE; badge OUTSIDE = INSIDE"}
    fx: [molecules, xray_look]
    mood: calm, clear
    out: cut

  - id: S05a
    line: 4                     # "But as the plane climbs..."
    set: sky_high
    size: WS
    angle: aerial
    lens_mm: 50
    move: pan_follow            # camera holds its height while the bigger jet climbs nose-up past the clouds
    fx: [volumetric_clouds, atmosphere_haze]
    mood: cold, vast
    out: cut

  - id: S05b
    line: 4                     # "...the cabin pressure drops."
    from_word: cabin
    set: ear_inside
    size: MS
    angle: pov
    lens_mm: 30
    move: dolly_out             # inside the middle ear, facing the eardrum; outside air thins beyond it
    beats:
      - {word: drops, do: "blue molecules beyond the eardrum thin out"}
    fx: [molecules, translucent_eardrum]
    out: cut

  - id: S06a
    line: 5                     # "The trapped air pushes outward..."
    set: ear_inside
    size: CU
    angle: low
    lens_mm: 24
    move: dolly_in              # behind the crowding amber air, toward the eardrum
    beats:
      - {word: pushes, do: "amber molecules crowd against the eardrum"}
    fx: [molecules, shallow_dof]
    mood: tense
    out: cut

  - id: S06b
    line: 5                     # "...and your eardrum bulges, like a balloon."
    from_word: and
    set: ear_map
    size: CU
    angle: eye
    lens_mm: 50
    move: dolly_in              # profile cutaway: the eardrum bulges out past its faint resting outline
    beats:
      - {word: bulges, do: "eardrum balloons outward past the outline; badge INSIDE > OUTSIDE"}
      - {word: balloon, do: "hold the bulge, a tiny wobble"}
    fx: [xray_look, strain_glow]
    mood: tense
    out: cut

  - id: S07
    line: 6                     # "That's the muffled, blocked feeling."
    set: cabin
    size: CU
    angle: eye
    lens_mm: 85
    move: handheld:0.2
    beats:
      - {word: muffled, do: "Max winces, hand over his ear; audio muffle on"}
    fx: [shallow_dof, desaturate_10pct]
    mood: discomfort
    out: cut

  - id: S08a
    line: 7                     # "Then a tiny tube to your throat -"
    set: ear_inside
    size: WS
    angle: high
    lens_mm: 24
    move: crane_down            # dives toward the closed tube mouth at the floor of the middle ear
    beats:
      - {word: tube, do: "the tube mouth below, closed"}
    fx: [molecules, subsurface_tissue]
    mood: hope
    out: cut

  - id: S08b
    line: 7                     # "the Eustachian tube - cracks open."
    from_word: Eustachian
    set: ear_inside
    size: CU
    angle: high
    lens_mm: 28
    move: dolly_in              # close on the tube mouth: the slit parts on "cracks", amber air drains down it
    beats:
      - {word: cracks, do: "slit opens; amber air leaves the middle ear toward the throat"}
    fx: [molecules]
    mood: hope
    out: cut

  - id: S09a
    line: 8                     # "Air escapes, the pressure evens out,..."
    set: ear_inside
    size: MACRO
    angle: pov
    lens_mm: 18
    move: flythrough            # ride down the tube with the escaping air
    beats:
      - {word: escapes, do: "amber molecules stream down the tube around the camera"}
      - {word: evens, do: "pressure evens"}
    fx: [molecules, motion_blur]
    mood: release
    out: whip:up

  - id: S09b
    line: 8                     # "...and... POP!"  (held until the snap and ring finish)
    from_word: and
    set: ear_inside
    size: CU
    angle: pov
    lens_mm: 28
    move: dolly_in
    beats:
      - {word: pop, do: "eardrum snaps flat (no burst); soft light ring; small camera jolt"}
    fx: [shockwave_ripple, bloom_flash]
    mood: satisfying
    out: cut

  - id: S09c
    line: 8                     # (pause after POP) Max's relief
    from_word: pop
    offset: 0.55
    set: cabin
    size: CU
    angle: eye
    lens_mm: 85
    move: dolly_in
    beats:
      - {at: 0.0, key: relief, do: "Max's relief: eyes open, a small exhale and smile"}
    mood: relief
    out: cut

  - id: S10
    line: 9                     # "Descending can be worse."
    set: city_dusk
    size: WS
    angle: high
    lens_mm: 35
    move: drone_track
    fx: [city_lights, atmosphere_haze, motion_blur]
    mood: serious, cooler grade
    out: cut

  - id: S11a
    line: 10                    # "Cabin pressure rises, but the tube stays shut,"
    set: ear_inside
    size: MS
    angle: low
    lens_mm: 22
    move: arc:20
    tilt: dutch:0->-5
    beats:
      - {word: rises, do: "blue outside air thickens beyond the eardrum"}
      - {word: shut, do: "tube pinched shut; red warning pulse"}
    fx: [molecules, warning_pulse]
    mood: uneasy
    out: cut

  - id: S11b
    line: 10                    # "so your eardrum gets pushed inward."
    from_word: so
    set: ear_map
    size: CU
    angle: eye
    lens_mm: 50
    move: dolly_in              # profile cutaway: the eardrum caves inward past its resting outline
    beats:
      - {word: inward, do: "eardrum pushed in; badge OUTSIDE > INSIDE"}
    fx: [xray_look, warning_pulse]
    mood: uneasy
    out: cut

  - id: S12a
    line: 11                    # "That's why swallowing, yawning, or chewing gum helps -"
    set: cabin
    size: CU
    angle: eye
    lens_mm: 70
    move: dolly_in              # one sustained close-up: swallow, yawn, chew (captions name each)
    beats:
      - {word: swallowing, do: "Max swallows"}
      - {word: yawning, do: "Max yawns"}
      - {word: chewing, do: "Max chews"}
    fx: [shallow_dof, warm_shift]
    mood: relief
    out: cut

  - id: S12b
    line: 11                    # "they pull the tube open."
    from_word: they
    set: ear_map
    size: MS
    angle: eye
    lens_mm: 40
    move: dolly_in              # the tube opens, blue air flows UP into the middle ear, the eardrum returns flat
    beats:
      - {word: pull, do: "tube opens; blue air rises into the middle ear"}
      - {word: open, do: "eardrum back to its resting outline; badge OUTSIDE = INSIDE"}
    fx: [xray_look]
    mood: relief
    out: cut

  - id: S13
    line: 11                    # tail: relief + on-screen "Follow for more" (no spoken outro)
    from_word: open
    offset: 0.6
    set: cabin
    size: CU
    angle: eye
    lens_mm: 85
    move: dolly_in
    beats:
      - {at: 0.2, key: thumbs, do: "Max relieved, grin and thumbs-up; FOLLOW card"}
    fx: [shallow_dof]
    mood: warm
    end: loop_match             # ends on Max's face, which cuts back to the opening wince on a rewatch
