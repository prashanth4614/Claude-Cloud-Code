# Pilot: "Why your ears pop on a plane", production-pipeline remake (see PIPELINE.md)
#
# spoken:  what ElevenLabs v3 reads. [tags] steer delivery; "..." and "-" make natural pauses.
# caption: on-screen words (no tags).
# shot:    what the Blender scene shows (drives shots.yaml / the scene build).
# sfx:     designed accents, anchored to a spoken word or a time offset. Sparse on purpose.
# bed:     which ambience bed plays under the line.
# take:    where the audio comes from. [1, n] = line n of the approved take 1 (takes/take1.json, cached,
#          free to rebuild); "until: <word>" keeps it only up to that word. [2] = generated in take 2
#          (only the new lines, in order), so a rewrite never re-records the lines we kept.
# pause_after: extra silence after the line (seconds), e.g. to let the POP land.
# keywords: words whose caption chunk is highlighted.

title: Why Your Ears Pop on a Plane
voice: elevenlabs:x5ld1ovD8agu3EPB7Qpj
host: Max

lines:
  - spoken: "[curious] Ever wondered why your ears pop on a plane?"
    caption: "Ever wondered why your ears pop on a plane?"
    take: [1, 1]
    keywords: [pop]
    shot: "Cold open on Max wincing, then the airliner climbing through clouds; push into Max's ear."
    bed: none
    sfx: [{at: 0.0, cue: jet_climb}]

  - spoken: "Behind your eardrum sits a tiny pocket of air - your middle ear."
    caption: "Behind your eardrum sits a tiny pocket of air - your middle ear."
    take: [1, 3]
    keywords: [eardrum, middle]
    shot: "Fly down the ear canal to the eardrum; the middle ear behind it."
    bed: body
    sfx: [{at: 0.0, cue: into_ear}]

  - spoken: "On the ground, the pressure inside matches the air outside. Perfectly balanced."
    caption: "On the ground, the pressure inside matches the air outside."
    take: [1, 4]
    until: outside
    keywords: [matches]
    shot: "Through the eardrum into the middle ear; then the labelled x-ray map, inside = outside."
    bed: body

  - spoken: "But as the plane climbs... the cabin pressure drops."
    caption: "But as the plane climbs, the cabin pressure drops."
    take: [1, 5]
    keywords: [climbs, drops]
    shot: "The airliner visibly climbing past the clouds; outside molecules thin beyond the eardrum."
    bed: body

  - spoken: "[slightly tense] The trapped air pushes outward... and your eardrum bulges, like a balloon."
    caption: "The trapped air pushes outward, and your eardrum bulges, like a balloon."
    take: [1, 6]
    keywords: [outward, bulges]
    shot: "Amber air crowds the eardrum; profile cutaway: the eardrum bulges out past its resting outline."
    bed: body
    sfx: [{word: bulges, cue: stretch}]

  - spoken: "[softly] That's the muffled, blocked feeling."
    caption: "That's the muffled, blocked feeling."
    take: [1, 7]
    keywords: [muffled]
    shot: "Max wincing, hand over his ear; the cabin sound goes muffled."
    bed: cabin
    fx: muffle

  - spoken: "Then a tiny tube to your throat - the Eustachian tube - cracks open."
    caption: "Then a tiny tube to your throat - the Eustachian tube - cracks open."
    take: [1, 8]
    keywords: [Eustachian, cracks]
    shot: "Crane down to the tube; its closed slit parts and amber air leaves toward the throat."
    bed: body
    sfx: [{word: cracks, cue: tube_open}]

  - spoken: "Air escapes, the pressure evens out, and... [playful] pop!"
    caption: "Air escapes, the pressure evens out, and... POP!"
    take: [1, 9]
    pause_after: 1.1
    keywords: [POP]
    shot: "Ride down the tube with the air; the eardrum snaps flat (held), then Max's relief."
    bed: body
    sfx: [{word: escapes, cue: air_release}, {word: pop, cue: ear_pop}]

  - spoken: "[serious] Descending can be worse."
    caption: "Descending can be worse."
    take: [2]
    keywords: [worse]
    shot: "Exterior: the airliner descends toward city lights at dusk, landing gear down."
    bed: none
    sfx: [{at: 0.0, cue: gear_down}]

  - spoken: "Cabin pressure rises... but the tube stays shut - so your eardrum gets pushed inward."
    caption: "Cabin pressure rises, but the tube stays shut, so your eardrum gets pushed inward."
    take: [2]
    keywords: [rises, shut, inward]
    shot: "Outside air returns, the tube pinched shut and red; profile cutaway: the eardrum pushed in."
    bed: body
    sfx: [{word: inward, cue: squeeze}]

  - spoken: "[warm] That's why swallowing, yawning, or chewing gum helps - they pull the tube open."
    caption: "That's why swallowing, yawning, or chewing gum helps - they pull the tube open."
    take: [1, 12]
    keywords: [swallowing, yawning, chewing, open]
    shot: "Max close-up: swallow, yawn, chew; the tube opens, air flows up into the middle ear, the eardrum
      returns flat; Max relieved, on-screen 'Follow for more' (no spoken outro), loops to the wince."
    bed: cabin
    sfx: [{word: yawning, cue: card_soft}]

# ElevenLabs Sound Effects prompts. Each one is generated once and cached in assets/sfx/.
# Mixed per PIPELINE.md: soft, low, filtered.
sfx_cues:
  jet_climb:   {seconds: 3.0, prompt: "Distant passenger jet climbing past, smooth warm engine rumble, soft and cinematic, no harsh highs"}
  into_ear:    {seconds: 1.2, prompt: "Very soft airy whoosh, gentle and warm, short, like gliding into a tunnel"}
  stretch:     {seconds: 1.5, prompt: "Subtle soft organic stretching creak, rubbery membrane, very quiet and close"}
  tube_open:   {seconds: 0.8, prompt: "Tiny soft wet click of something opening, organic, gentle, close"}
  air_release: {seconds: 1.2, prompt: "Gentle soft air release hiss, short, muffled, calm"}
  ear_pop:     {seconds: 0.8, prompt: "Soft satisfying ear pop, muffled and gentle, like ears equalizing on a plane, close"}
  gear_down:   {seconds: 2.0, prompt: "Airplane landing gear lowering heard from the cabin, distant soft clunk and wind, subdued"}
  squeeze:     {seconds: 1.5, prompt: "Soft low muted pressure groan, subtle, organic, not scary"}
  card_soft:   {seconds: 0.6, prompt: "Very soft paper card slide, gentle, quiet"}
  outro_chime: {seconds: 1.5, prompt: "Single gentle warm chime, soft felt piano note with light shimmer, calm"}

  # v3: clean single hits (Codex 006 prompt prefix), placed by their anchor in mix.py
  v3_whoosh_in: {seconds: 0.6, prompt: "Isolated close-miked dry Foley, silent studio, distinct attack, short decay; no music, speech, ambience or reverb. compact inward swish, like a camera diving into a small opening"}
  v3_whoosh_pass: {seconds: 0.7, prompt: "Isolated close-miked dry Foley, silent studio, distinct attack, short decay; no music, speech, ambience or reverb. smooth passing swish, soft and airy"}
  v3_whip: {seconds: 0.5, prompt: "Isolated close-miked dry Foley, silent studio, distinct attack, short decay; no music, speech, ambience or reverb. quick whip pan swish"}
  v3_pop: {seconds: 0.5, prompt: "Isolated close-miked dry Foley, silent studio, distinct attack, short decay; no music, speech, ambience or reverb. rounded satisfying pressure snap, an ear popping, soft click with a short low body"}
  v3_stretch: {seconds: 0.8, prompt: "Isolated close-miked dry Foley, silent studio, distinct attack, short decay; no music, speech, ambience or reverb. taut latex membrane stretching outward, subtle rubbery creak"}
  v3_valve: {seconds: 0.5, prompt: "Isolated close-miked dry Foley, silent studio, distinct attack, short decay; no music, speech, ambience or reverb. moist soft valve click, a small wet tube opening"}
  v3_air: {seconds: 0.6, prompt: "Isolated close-miked dry Foley, silent studio, distinct attack, short decay; no music, speech, ambience or reverb. brief soft escaping air, gentle hiss release"}
  v3_thud: {seconds: 0.5, prompt: "Isolated close-miked dry Foley, silent studio, distinct attack, short decay; no music, speech, ambience or reverb. muted padded thud, soft and low"}
  v3_swallow: {seconds: 0.7, prompt: "Isolated close-miked dry Foley, silent studio, distinct attack, short decay; no music, speech, ambience or reverb. single restrained human swallow gulp, close"}
  v3_yawn: {seconds: 1.3, prompt: "Isolated close-miked dry Foley, silent studio, distinct attack, short decay; no music, speech, ambience or reverb. quiet breathy male yawn, short, close"}
  v3_chew: {seconds: 0.5, prompt: "Isolated close-miked dry Foley, silent studio, distinct attack, short decay; no music, speech, ambience or reverb. single soft gum chew, moist, close"}
  v3_pluck: {seconds: 0.5, prompt: "Isolated close-miked dry Foley, silent studio, distinct attack, short decay; no music, speech, ambience or reverb. muted soft UI pluck, gentle click for a label appearing"}

  # v6 (mix v6, Codex 007): the scene and relief cues
  v6_jet_swell: {seconds: 4.0, prompt: "Isolated passenger jet flying past high above, smooth rising engine swell then fade, clean, no wind noise"}
  v6_plane_descend: {seconds: 4.0, prompt: "Isolated airliner descending, soft engine roar slowly lowering in pitch, smooth, clean"}
  v6_exhale: {seconds: 1.2, prompt: "Isolated relieved soft human exhale sigh, close-miked, clean, short"}
  v6_release: {seconds: 1.2, prompt: "Isolated soft airy pressure release hiss, gentle and satisfying, clean"}
  v8_boom: {seconds: 1.5, prompt: "Isolated deep cinematic sub-bass boom impact, single hit, warm low thump with short rumble decay, clean, no music, no reverb tail"}

beds:
  cabin: {seconds: 20, loop: true, prompt: "Quiet airplane cabin ambience, soft low engine hum, gentle air vent hiss, no voices, no announcements, calm"}
  body:  {seconds: 20, loop: true, prompt: "Calm soft body interior ambience, slow muffled heartbeat far away, gentle low warm whoosh, soothing"}
  # v6: continuous room tone per world + the blocked-ear drone (mix.py beds() / pressure())
  v6b_cabin: {seconds: 20, loop: true, prompt: "Airplane cabin room tone, clearly audible soft steady air vent hiss over a gentle engine hum, mid-range presence, constant, no voices, no music, no clicks"}
  v6b_ear: {seconds: 20, loop: true, prompt: "Soft airy breathy whoosh room tone, gentle filtered air movement inside a small warm space, constant, mid-range, soothing, no heartbeat, no music"}
  v6b_sky: {seconds: 20, loop: true, prompt: "Soft steady high-altitude wind whoosh, airy and smooth, constant, mid-range, calm, no gusts, no music"}
  v6b_city: {seconds: 20, loop: true, prompt: "Calm city evening room tone, soft distant traffic wash and faint air, constant, mid-range, no horns, no voices, no music"}
  v6_blocked: {seconds: 12, loop: true, prompt: "no music, no speech, no voices, no clicks, smooth and even, blocked ear pressure sensation, muffled low dull pressure drone, underwater-like fullness, soft and steady"}

music:
  prompt: >-
    Gentle curious documentary underscore for a 45-second science explainer: felt piano with soft
    pizzicato strings and a warm pad, about 80 bpm, light and wondering, no drums, no vocals, sparse
    so a narrator sits clearly on top, a subtle lift around 25 seconds for a reveal, then a calm warm
    resolve at the end.
  # mix v6 score (audio/bgm/v6_music_d.mp3: music_length_ms 47400, force_instrumental), Codex 007's brief
  v6_prompt: >-
    47.4-second instrumental science miniature, 90bpm; sparse felt piano, warm pad, occasional soft
    pizzicato. Clean modern recording, restrained curiosity; no drums, vocals, hiss or stings. 0-11 s
    wonder; 11-27 s gentle tension; 27-30.7 s suspended texture; 30.7 s soft harmonic release; 31-45 s
    warm clarity; 45-47.4 s return to opening harmony/texture, seamless re-entry.
  fallback_search: "YouTube Audio Library: Genre Cinematic or Ambient, Mood Calm or Inspirational, no vocals, 70-90 bpm, piano"
